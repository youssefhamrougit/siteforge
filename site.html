<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>siteforge</title>
</head>
<body>
    <style>

* { box-sizing : border-box; margin:0; padding: 0; }
body { font-family : var(--font-sans); }
#app { display : flex; flex-direction: column; height:600px; background: var(--color-background-primary); border:0.5px solid var(--color-border-tertiary);border-radius: var(--border-radius-lg); overflow: hidden; }
#toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); flex-shrink: 0; }
#toolbar-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-right: 4px; }
  .template-btn { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .template-btn:hover { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #left { display: flex; flex-direction: column; width: 300px; flex-shrink: 0; border-right: 0.5px solid var(--color-border-tertiary); }
  #prompt-area { flex: 1; padding: 12px; }
  #prompt { width: 100%; height: 100%; resize: none; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-background-primary); line-height: 1.5; outline: none; }
  #prompt:focus { border-color: var(--color-border-info); }
  #bottom-bar { padding: 10px 12px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  #generate-btn { flex: 1; padding: 8px; border-radius: var(--border-radius-md); border: none; background: var(--color-text-primary); color: var(--color-background-primary); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #generate-btn:hover { opacity: 0.85; }
  #generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #download-btn { padding: 8px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  #download-btn:hover { background: var(--color-background-secondary); }
  #download-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #preview-bar { padding: 8px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }
  #preview-label { font-size: 12px; color: var(--color-text-secondary); margin-left: 4px; }
  #preview-frame { flex: 1; border: none; width: 100%; background: white; }
  #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--color-text-tertiary); font-size: 13px; }
  #empty-state i { font-size: 32px; opacity: 0.3; }
  #loading-overlay { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--color-border-tertiary); border-top-color: var(--color-text-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 13px; color: var(--color-text-secondary); }
  #error-msg { font-size: 12px; color: var(--color-text-danger); padding: 6px 12px; display: none; }

  

    </style>



<h2> SiteForge — AI-powered website builder. Type a description and Claude generates a live website preview.</h2>

<div id="main"> 
    <div id="left"> 
        <div id="prompt-area"> 
            <textarea id="prompt" placeholder="Describe your website ...&#10;&#10;e.g. A portfolio for a photographer named Sara with a dark elegant theme and a gallery section">  </textarea> </div>
        <div id ="error-msg"> </div>
        <div id="bottom-bar"> </div>
        <button id="generate-btn" onclick="generate()"> </button>
        <i class="ti ti-download" aria-hidden="true"> generate </i> 
    </div> 
</div>

<div> 
<div id="right">
    <div id="preview-bar">
    <div class="dot dot-red"> </div>
    <div class="dot dot-yellow"> </div> 
    <div class="dot dot-green"> </div>
    <span id="preview-label"> preview </span>
    </div>
        <div id="empty-state"> 
            <i class="ti ti-browser" aria-hidden="true"></i>
            <span> Your website preview will appear here </span>
            <div class="spinner"> </div>
            <div id="loading-text"> building your website... </div>
        </div>
        <iframe id="preview-frame" style="display:none;" sandbox="allow-scripts">  </iframe>
        </div>
    </div>  
</div>

<script>

let currentHTML = '';
let conversationhistory=[];
const templates = {
  portfolio: "A sleek portfolio website for a UI/UX designer named Alex Chen. Include a hero section with a tagline, a projects grid with 3 case study cards, an about section, and a contact form. Use a clean minimal aesthetic with lots of white space and a subtle blue accent color.",
  landing: "A SaaS landing page for a tool called 'Flowmate' that helps teams manage projects. Include a hero with a headline and CTA button, a 3-feature section with icons, a pricing table with 2 tiers (Free and Pro), and a footer. Use a modern dark navy theme with purple accents.",
  restaurant: "A restaurant website for 'Casa Bella', an Italian fine dining restaurant in Paris. Include a full-width hero image (use a gradient placeholder), a menu section with 3 categories (Antipasti, Pasta, Dolci), a reservation form, and an elegant footer. Use warm cream and terracotta colors.",
  blog: "A personal blog for a travel writer named Maya. Include a hero with a large headline, a 4-post grid with thumbnail placeholders (colored divs), a sidebar with categories and recent posts, and a newsletter signup. Use a warm editorial aesthetic with serif fonts."
};

function useTemplate(name) {
  document.getElementById('prompt').value = templates[name];
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

async function generate() {
  const promptVal = document.getElementById('prompt').value.trim();
  if (!promptVal) return;

  const btn = document.getElementById('generate-btn');
  const emptyState = document.getElementById('empty-state');
  const loadingOverlay = document.getElementById('loading-overlay');
  const frame = document.getElementById('preview-frame');

  btn.disabled = true;
  emptyState.style.display = 'none';
  frame.style.display = 'none';
  loadingOverlay.style.display = 'flex';
  document.getElementById('error-msg').style.display = 'none';

  const loadingMessages = ['Building your website...', 'Writing HTML & CSS...', 'Adding finishing touches...', 'Almost ready...'];
  let msgIdx = 0;
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % loadingMessages.length;
    document.getElementById('loading-text').textContent = loadingMessages[msgIdx];
  }, 2000);

  const systemPrompt = `You are an expert web developer. When given a website description, you generate a complete, beautiful, single-file HTML website.

RULES:
- Return ONLY raw HTML. No markdown, no backticks, no explanation. Start with <!DOCTYPE html>.
- Embed ALL CSS in a <style> tag inside <head>.
- Embed ALL JS in a <script> tag before </body>.
- Use Google Fonts for beautiful typography.
- Make it visually stunning with real sections, real content, and professional design.
- Use placeholder colors/gradients instead of images.
- Make it fully responsive with a mobile-friendly layout.
- Include hover effects, smooth transitions, and polished UI details.
- Content should feel real and populated, not generic lorem ipsum.`;

  conversationHistory.push({ role: 'user', content: promptVal });

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 4000,
        system: systemPrompt,
        messages: conversationHistory
      })
    });

    const data = await response.json();

    if (data.error) {
      showError(data.error.message || 'API error. Check your API key.');
      loadingOverlay.style.display = 'none';
      emptyState.style.display = 'flex';
      btn.disabled = false;
      clearInterval(msgInterval);
      return;
    }

    const html = data.content.map(b => b.text || '').join('');
    conversationHistory.push({ role: 'assistant', content: html });
    currentHTML = html;

    clearInterval(msgInterval);
    loadingOverlay.style.display = 'none';
    frame.style.display = 'block';
    frame.srcdoc = html;
    document.getElementById('download-btn').disabled = false;
    document.getElementById('preview-label').textContent = 'live preview';

  } catch (err) {
    clearInterval(msgInterval);
    showError('Request failed. Try again.');
    loadingOverlay.style.display = 'none';
    emptyState.style.display = 'flex';
  }

  btn.disabled = false;
}

function download() {
  if (!currentHTML) return;
  const blob = new Blob([currentHTML], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'website.html';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
});
</script>


</script>

</body>
</html>
