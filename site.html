<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>siteforge</title>
</head>
<body>
    <style>

* { box-sizing : border*box; margin : 0; padding 0; }
body { font-family : var(--font-sans); }
#app { display : flex; flex-direction: column; height:600px; background: var(--color-background-primary); border:0.5px solid var(--color-border-tertiary);border-radius: var(--border-radius-lg); overflow: hidden; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); flex-shrink: 0; }
#toolbar-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-right: 4px; }
  .template-btn { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .template-btn:hover { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #left { display: flex; flex-direction: column; width: 300px; flex-shrink: 0; border-right: 0.5px solid var(--color-border-tertiary); }
  #prompt-area { flex: 1; padding: 12px; }
  #prompt { width: 100%; height: 100%; resize: none; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-background-primary); line-height: 1.5; outline: none; }
  #prompt:focus { border-color: var(--color-border-info); }
  #bottom-bar { padding: 10px 12px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  #generate-btn { flex: 1; padding: 8px; border-radius: var(--border-radius-md); border: none; background: var(--color-text-primary); color: var(--color-background-primary); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #generate-btn:hover { opacity: 0.85; }
  #generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #download-btn { padding: 8px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  #download-btn:hover { background: var(--color-background-secondary); }
  #download-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #preview-bar { padding: 8px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }
  #preview-label { font-size: 12px; color: var(--color-text-secondary); margin-left: 4px; }
  #preview-frame { flex: 1; border: none; width: 100%; background: white; }
  #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--color-text-tertiary); font-size: 13px; }
  #empty-state i { font-size: 32px; opacity: 0.3; }
  #loading-overlay { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--color-border-tertiary); border-top-color: var(--color-text-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 13px; color: var(--color-text-secondary); }
  #error-msg { font-size: 12px; color: var(--color-text-danger); padding: 6px 12px; display: none; }

  

    </style>



<h2> SiteForge — AI-powered website builder. Type a description and Claude generates a live website preview.</h2>

<div id="main"> 
    <div id="left"> 
        <div id="prompt-area"> 
            <textarea id="prompt" placeholder="Describe your website ...&#10;&#10;e.g. A portfolio for a photographer named Sara with a dark elegant theme and a gallery section">  </textarea> </div>
        <div id ="error-msg"> </div>
        <div id="bottom-bar"> </div>
        <button id="generate-btn" onclick="generate()"> </button>
        <i class="ti ti-download" aria-hidden="true"> generate </i> 
    </div> 
</div>

<div> 
<div id="right">
    <div id="preview-bar">
    <div class="dot dot-red"> </div>
    <div class="dot dot-yellow"> </div> 
    <div class="dot dot-green"> </div>
    <span id="preview-label"> preview </span>
    </div>
        <div id="empty-state"> 
            <i class="ti ti-browser" aria-hidden="true"></i>
            <span> Your website preview will appear here </span>
            <div class="spinner"> </div>
            <div id="loading-text"> building your website... </div>
        </div>
        <iframe id="preview-frame" style="display:none;" sandbox="allow-scripts">  </iframe>
        </div>
    </div>  
</div>



</body>
</html>
